[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-par"
description = "Par (⅋) is an experimental concurrent programming language. It's an attempt to bring the expressive power of linear logic into practice."
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "par"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "Thybault Alabarbe", email = "thybault.alabarbe@gmail.com" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/soulthym/tree-sitter-par"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
