[package]
name = "tree-sitter-par"
description = "Par (⅋) is an experimental concurrent programming language. It's an attempt to bring the expressive power of linear logic into practice."
version = "0.1.0"
authors = ["Thybault Alabarbe <thybault.alabarbe@gmail.com>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "par"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/soulthym/tree-sitter-par"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.8"
